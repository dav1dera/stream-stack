<g font-family="Segoe UI,Arial,sans-serif"><text x="315" y="68" fill="#eef4ff" font-size="30" font-weight="700">Rete &amp; Domini</text><text x="315" y="97" fill="#9fb1c7" font-size="14">Configura IP, subnet LAN e nomi pubblici dei servizi.</text>
<rect x="315" y="128" width="405" height="190" rx="10" fill="#111d2d" stroke="#293a52"/><text x="338" y="158" fill="#a993ff" font-size="13" font-weight="700">RETE</text><text x="338" y="194" fill="#dce6f5" font-size="13">IP privato del server *</text><rect x="338" y="207" width="165" height="38" rx="6" fill="#18263a"/><text x="352" y="232" fill="#eef4ff" font-size="14">192.168.1.50</text><text x="525" y="194" fill="#dce6f5" font-size="13">Subnet LAN *</text><rect x="525" y="207" width="165" height="38" rx="6" fill="#18263a"/><text x="539" y="232" fill="#eef4ff" font-size="14">192.168.1.0/24</text><text x="338" y="278" fill="#8193aa" font-size="12">L'IP deve essere statico o riservato via DHCP.</text>
<rect x="735" y="128" width="420" height="190" rx="10" fill="#111d2d" stroke="#293a52"/><text x="758" y="158" fill="#a993ff" font-size="13" font-weight="700">DOMINIO BASE</text><text x="758" y="194" fill="#dce6f5" font-size="13">Dominio base *</text><rect x="758" y="207" width="365" height="38" rx="6" fill="#18263a"/><text x="772" y="232" fill="#eef4ff" font-size="14">example.com</text><rect x="758" y="265" width="18" height="18" rx="4" fill="#755cff"/><text x="762" y="279" fill="#fff" font-size="12">✓</text><text x="786" y="279" fill="#dce6f5" font-size="13">Usa nomi standard derivati dal dominio base</text>
<rect x="315" y="338" width="840" height="300" rx="10" fill="#111d2d" stroke="#293a52"/><text x="338" y="370" fill="#a993ff" font-size="13" font-weight="700">HOSTNAME DEI SERVIZI</text><text x="338" y="394" fill="#8193aa" font-size="12">Disattiva i nomi standard per usare FQDN completamente personalizzati.</text>
<text x="338" y="432" fill="#dce6f5" font-size="12">AIOStreams</text><rect x="338" y="442" width="365" height="36" rx="6" fill="#18263a"/><text x="352" y="466" fill="#eef4ff" font-size="13">aiostreams.example.com</text>
<text x="735" y="432" fill="#dce6f5" font-size="12">Headscale + Headplane</text><rect x="735" y="442" width="388" height="36" rx="6" fill="#18263a"/><text x="749" y="466" fill="#eef4ff" font-size="13">headscale.example.com</text>
<text x="338" y="515" fill="#dce6f5" font-size="12">Seanime</text><rect x="338" y="525" width="365" height="36" rx="6" fill="#18263a"/><text x="352" y="549" fill="#eef4ff" font-size="13">seanime.example.com</text>
<text x="735" y="515" fill="#dce6f5" font-size="12">MediaFlow</text><rect x="735" y="525" width="388" height="36" rx="6" fill="#18263a"/><text x="749" y="549" fill="#eef4ff" font-size="13">mfp.example.com</text>
<text x="338" y="594" fill="#8fa2ba" font-size="12">La logica interna resta invariata anche usando nomi pubblici diversi.</text>
