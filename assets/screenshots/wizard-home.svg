<g font-family="Segoe UI,Arial,sans-serif">
<text x="315" y="76" fill="#eef4ff" font-size="34" font-weight="700">Configura tutto dal PC Windows</text>
<text x="315" y="108" fill="#9fb1c7" font-size="15">Il server Ubuntu resta completamente headless e viene gestito in sicurezza via SSH.</text>
<g>
<rect x="315" y="155" width="260" height="175" rx="10" fill="#111d2d" stroke="#293a52"/><circle cx="355" cy="198" r="22" fill="#2c285f"/><text x="347" y="205" fill="#a993ff" font-size="20">›_</text><text x="392" y="194" fill="#eef4ff" font-size="18" font-weight="700">Gestione via SSH</text><text x="392" y="220" fill="#9fb1c7" font-size="13">Connessione, upload dei file e</text><text x="392" y="241" fill="#9fb1c7" font-size="13">comandi eseguiti sul server.</text>
