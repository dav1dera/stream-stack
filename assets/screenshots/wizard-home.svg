<rect x="24" y="195" width="218" height="38" rx="7" fill="#2b285f"/><text x="42" y="219" fill="#fff" font-weight="700">1   Benvenuto</text>
<text x="42" y="266" fill="#adbed4">2   Server SSH</text><text x="42" y="310" fill="#adbed4">3   Rete &amp; Domini</text><text x="42" y="354" fill="#adbed4">4   VPN &amp; Proxy</text><text x="42" y="398" fill="#adbed4">5   API &amp; Servizi</text><text x="42" y="442" fill="#adbed4">6   OAuth &amp; Login</text><text x="42" y="486" fill="#adbed4">7   Opzionali</text><text x="42" y="530" fill="#adbed4">8   Riepilogo</text><text x="42" y="574" fill="#adbed4">9   Installazione</text><text x="42" y="618" fill="#adbed4">10  Completato</text>
