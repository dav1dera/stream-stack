<rect x="315" y="350" width="840" height="170" rx="10" fill="#111d2d" stroke="#293a52"/><text x="340" y="385" fill="#a993ff" font-size="13" font-weight="700">COSA FA IL WIZARD</text>
<text x="340" y="425" fill="#dbe6f5" font-size="14">✓ Test connessione SSH e prerequisiti</text><text x="340" y="458" fill="#dbe6f5" font-size="14">✓ Clone / aggiornamento della repository</text><text x="340" y="491" fill="#dbe6f5" font-size="14">✓ Creazione sicura di setup.env e configurazioni runtime</text>
<text x="750" y="425" fill="#dbe6f5" font-size="14">✓ Configurazione automatica di Nginx Proxy Manager</text><text x="750" y="458" fill="#dbe6f5" font-size="14">✓ Generazione chiavi Headscale / Jackett</text><text x="750" y="491" fill="#dbe6f5" font-size="14">✓ Avvio e verifica dello stack Docker</text>
<rect x="315" y="555" width="840" height="78" rx="10" fill="#121f31" stroke="#293a52"/><text x="340" y="584" fill="#a993ff" font-size="13" font-weight="700">PREREQUISITI</text><text x="340" y="611" fill="#aabbd0" font-size="14">Accesso SSH al server Ubuntu, domini e credenziali dei servizi esterni utilizzati.</text>
