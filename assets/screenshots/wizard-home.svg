<g>
<rect x="865" y="155" width="290" height="175" rx="10" fill="#111d2d" stroke="#293a52"/><circle cx="905" cy="198" r="22" fill="#2c285f"/><text x="896" y="205" fill="#a993ff" font-size="22">✓</text><text x="942" y="194" fill="#eef4ff" font-size="18" font-weight="700">Setup riproducibile</text><text x="942" y="220" fill="#9fb1c7" font-size="13">Secret generati, NPM configurato</text><text x="942" y="241" fill="#9fb1c7" font-size="13">e servizi verificati a fine setup.</text>
