<text x="32" y="118" font-size="11" fill="#9aacbf" font-weight="700">PROGRESSO</text><rect x="32" y="132" width="202" height="7" rx="4" fill="#26364b"/><rect x="32" y="132" width="35" height="7" rx="4" fill="url(#accent)"/>
<text x="32" y="162" font-size="12" fill="#9aacbf">1 / 10</text>
