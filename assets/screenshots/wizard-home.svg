<g>
<rect x="590" y="155" width="260" height="175" rx="10" fill="#111d2d" stroke="#293a52"/><circle cx="630" cy="198" r="22" fill="#2c285f"/><text x="620" y="205" fill="#a993ff" font-size="22">◎</text><text x="667" y="194" fill="#eef4ff" font-size="18" font-weight="700">Rete &amp; Domini</text><text x="667" y="220" fill="#9fb1c7" font-size="13">IP, subnet e nomi pubblici</text><text x="667" y="241" fill="#9fb1c7" font-size="13">personalizzabili per servizio.</text>
