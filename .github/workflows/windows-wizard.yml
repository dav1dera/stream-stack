name: Windows Setup Wizard

on:
  push:
    branches: [main]
    paths:
      - 'windows-wizard/**'
      - 'docker-compose.override.yml'
      - '.github/workflows/windows-wizard.yml'
  pull_request:
    paths:
      - 'windows-wizard/**'
      - 'docker-compose.override.yml'
      - '.github/workflows/windows-wizard.yml'
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python source
        run: |
          python -m py_compile windows-wizard/app.py
          python -m py_compile windows-wizard/remote.py
          python -m py_compile windows-wizard/launcher.py
          python -m py_compile windows-wizard/demo_launcher.py
          python -m py_compile windows-wizard/local_ready.py

  build-windows:
    needs: syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r windows-wizard/requirements.txt pyinstaller
      - name: Build standalone EXE
        shell: pwsh
        working-directory: windows-wizard
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name StreamStackSetupWizard --collect-all customtkinter --hidden-import app --hidden-import remote --hidden-import launcher --hidden-import demo_launcher local_ready.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: StreamStackSetupWizard-Windows
          path: windows-wizard/dist/StreamStackSetupWizard.exe
          if-no-files-found: error
